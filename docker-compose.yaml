services:
  n8n:
    # Versión fijada a propósito (B.14). Con :latest, actualizar era un efecto
    # secundario de cualquier pull o recreate. Subir de versión es un acto
    # deliberado: respaldo previo (B.13) y re-verificación de los workflows.
    image: n8nio/n8n:2.19.5
    container_name: n8n_server
    restart: always
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      # Clave que cifra las credenciales (B.13). Vive en .env, fuera de git.
      # Es la MISMA que n8n generó en el primer arranque: cambiarla deja las
      # credenciales irrecuperables. Si falta, compose se niega a arrancar.
      - "N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?Falta N8N_ENCRYPTION_KEY en .env - ver B.13}"
      # Token del bot de Telegram para WF6 (13.13.6, opción A). WF6 consulta
      # los mensajes con getUpdates desde un nodo HTTP, y la credencial de
      # Telegram de n8n no sirve para eso: el token va en la ruta de la URL.
      # Vive en .env, fuera de git. Nunca escribirlo en un nodo: el JSON
      # exportado va al repo público.
      - "TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:?Falta TELEGRAM_BOT_TOKEN en .env - ver 13.13.6}"
      # Permite leer las variables de entorno desde los nodos ($env). Costo
      # aceptado (13.13.6): una expresión puede leer TODAS, incluida
      # N8N_ENCRYPTION_KEY. Con un solo usuario, que ya tiene acceso a todo,
      # el riesgo nuevo es bajo. Al pasar WF6 a webhook (Telegram Trigger),
      # volver a bloquearlo y sacar TELEGRAM_BOT_TOKEN.
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_storage:/home/node/.n8n

volumes:
  n8n_storage:
    # Nombre fijado (B.13). Sin esto, el nombre real se deriva de la carpeta
    # del proyecto: renombrar D:\tesis haría arrancar n8n sobre un volumen vacío.
    name: tesis_n8n_storage
